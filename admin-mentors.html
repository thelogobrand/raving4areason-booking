<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Mentors</title></head><body data-admin-page="mentors"><div class="logo-wrap"><img src="r4ar.png" class="logo"></div><main class="container admin-container"><button class="back-chip" onclick="location.href='admin.html'">← Back</button><h1>Mentors</h1><button onclick="openMentorAdminForm()">ADD MENTOR</button><div id="addMentorSection" class="form-panel" style="display:none"><input id="newMentorArtistName" placeholder="Artist Name *"><input type="email" id="newMentorEmail" placeholder="Email *"><input id="newMentorName" placeholder="Full / Legal Name (optional)"><input type="tel" id="newMentorPhone" placeholder="Phone Number (optional)"><select id="newMentorType"><option value="">Select Type (optional)</option><option>DJ</option><option>MC</option><option>Production</option></select><select id="newMentorLocation"><option value="">Default Location (optional)</option></select><textarea id="newMentorAdminNotes" class="large-notes admin-notes-large" rows="8" placeholder="Admin notes (optional)"></textarea><label class="check-row dbs-row"><input type="checkbox" id="newMentorDbsChecked"><span>DBS Checked ✅</span></label><button id="saveMentorBtn" onclick="saveMentorAdmin()">SAVE MENTOR</button><button class="secondary" onclick="cancelMentorEdit()">CANCEL</button></div><div class="member-tools"><input type="search" id="mentorAdminSearch" placeholder="Search mentor / artist / email / phone" oninput="filterAdminMentors()"></div><div id="adminMentors"></div><button class="secondary section-bottom-action" onclick="printAdminList('mentors')">DOWNLOAD / PRINT MENTORS</button></main><script src="data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
