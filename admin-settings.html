<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Accounts & Security</title></head><body data-admin-page="settings"><div class="logo-wrap"><img src="r4ar.png" class="logo"></div><main class="container admin-container"><button class="back-chip" onclick="location.href='admin.html'">← Back</button><h1>Accounts & Security</h1>
<section class="settings-card"><h2>Admin Account</h2><label class="field-label">Admin login email</label><input type="email" id="settingAdminEmail" placeholder="Admin login email"><button onclick="saveAdminEmailSetting()">CHANGE ADMIN EMAIL</button><label class="field-label">New admin password</label><input type="password" id="settingAdminPassword" placeholder="Minimum 8 characters"><input type="password" id="settingAdminPasswordConfirm" placeholder="Confirm new password"><button onclick="saveAdminPasswordSetting()">CHANGE ADMIN PASSWORD</button></section>
<section class="settings-card"><h2>Parent Portal</h2><input type="password" id="settingParentPassword" placeholder="New parent portal password — minimum 8 characters"><input type="password" id="settingParentPasswordConfirm" placeholder="Confirm new password"><button onclick="saveParentPasswordSetting()">CHANGE PARENT PASSWORD</button></section>
<section class="settings-card"><h2>Reset Mentor Password</h2><select id="settingMentorSelect"><option value="">Select mentor</option></select><input type="password" id="settingMentorPassword" placeholder="New mentor password — minimum 8 characters"><input type="password" id="settingMentorPasswordConfirm" placeholder="Confirm new password"><button onclick="resetMentorPasswordAdmin()">RESET MENTOR PASSWORD</button></section>
<section class="settings-card"><h2>Automatic R4AR Email Settings</h2><p class="small-muted">Change where automatic booking and expense notifications are sent. The From address must be verified with your email provider before public launch.</p><label class="field-label">Booking / Admin notification email</label><input type="email" id="settingNotificationEmail" placeholder="unitypromotionsuk@gmail.com"><label class="field-label">Expense notification email</label><input type="email" id="settingExpenseEmail" placeholder="unitypromotionsuk@gmail.com"><label class="field-label">Reply-to email (optional)</label><input type="email" id="settingReplyToEmail" placeholder="R4AR reply-to email"><label class="field-label">From email</label><input type="email" id="settingFromEmail" placeholder="onboarding@resend.dev"><button onclick="saveAutomaticEmailSettings()">SAVE EMAIL SETTINGS</button></section>
<section class="settings-card"><h2>Mileage Rate</h2><label class="field-label">Payment per mile (£)</label><input type="number" id="settingMileageRate" min="0.01" max="5" step="0.01" value="0.45"><button onclick="saveMileageRateSetting()">CHANGE MILEAGE RATE</button></section>
</main><script src="data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
