<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book a Mentor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/images/bookapp-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/bookapp-icon.png">
<meta name="theme-color" content="#000000">
</head>

<body>

  <div class="logo-wrap">
    <img src="r4ar.png" alt="Raving 4 A Reason" class="logo">
  </div>

  <div class="container">
    <h1 id="bookPageTitle">Book a Mentor</h1>

    <div id="adminBookingNotice" class="admin-booking-notice" style="display:none;">
      You are booking this session on behalf of a parent.
    </div>

    <select id="searchType">
      <option value="">All Types</option>
      <option value="DJ">DJ</option>
      <option value="MC">MC</option>
      <option value="Production">Production</option>
    </select>

    <select id="searchMentor">
      <option value="">All Mentors</option>
    </select>

    <select id="searchLocation">
      <option value="">All Locations</option>
    </select>


    <input type="date" id="searchDate">

    <button onclick="searchSlots()">SEARCH</button>
    <button onclick="clearSearchFilters()" class="secondary">CLEAR FILTERS</button>
    <button onclick="goHome()" class="secondary">BACK</button>

    <div id="searchResults"></div>
  </div>

  <footer>
    Raving 4 A Reason CIC | C.I.C REG 16251433
  </footer>

 <script src="data.js"></script>

  <!-- ✅ Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ✅ Then your app -->
  <script src="app.js"></script>
</body>
</html>
