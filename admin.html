<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Admin Panel</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><meta name="theme-color" content="#000"></head><body><div class="logo-wrap"><img src="r4ar.png" class="logo" alt="Raving 4 A Reason"></div><main class="container admin-container"><div id="loginBox"><h1>Admin Login</h1><input id="adminUsername" placeholder="Username / email"><input type="password" id="adminPassword" placeholder="Password"><button onclick="loginAdmin()">LOGIN</button></div><div id="adminPanel" style="display:none"><div class="admin-top-row"><h1>Admin Panel</h1><button class="message-envelope" onclick="location.href='admin-messages.html'">✉️<span id="adminMessageBadge" class="message-badge"></span></button></div><div class="admin-group"><h2>DASHBOARD</h2><div id="dashboardSummary" class="dashboard-grid"></div></div><div class="admin-group"><h2>SESSIONS</h2><button class="secondary" onclick="toggleSection('slotsSection')">CURRENT SESSIONS</button><div id="slotsSection" class="admin-section" style="display:none"><button class="secondary" onclick="printSessionList('available')">DOWNLOAD / PRINT</button><div id="adminSlots"></div></div><button class="secondary" onclick="toggleSection('bookedSection')">BOOKED SESSIONS</button><div id="bookedSection" class="admin-section" style="display:none"><button class="secondary" onclick="printSessionList('booked')">DOWNLOAD / PRINT</button><div id="adminBookedSessions"></div></div><button class="secondary" onclick="toggleSection('addSessionSection')">ADD SESSION</button><div id="addSessionSection" class="admin-section form-panel" style="display:none"><input type="date" id="date"><select id="type"><option value="">Select Type</option><option>DJ</option><option>MC</option><option>Production</option></select><select id="mentor"><option value="">Select Mentor</option></select><select id="location"><option value="">Select Location</option></select><input id="time" type="time"><button onclick="addSlot()">SAVE SESSION</button></div></div><div class="admin-group"><h2>MEMBERS</h2><button class="secondary" onclick="location.href='admin-members.html'">OPEN MEMBERS</button></div><div class="admin-group"><h2>MENTORS</h2><button class="secondary" onclick="location.href='admin-mentors.html'">OPEN MENTORS</button></div><div class="admin-group"><h2>LOCATIONS</h2><button class="secondary" onclick="location.href='admin-locations.html'">OPEN LOCATIONS</button></div><div class="admin-group"><h2>EXPENSES</h2><button class="secondary" onclick="location.href='admin-expenses.html'">VIEW EXPENSES</button></div><div class="admin-group"><h2>NEWS & EVENTS</h2><button class="secondary" onclick="toggleSection('newsEventsSection');renderAdminNewsEvents()">OPEN NEWS & EVENTS</button><div id="newsEventsSection" class="admin-section" style="display:none"><div class="form-panel"><h3>Add Newsletter</h3><input id="newsTitle" placeholder="Title"><input type="date" id="newsDate"><label class="field-label">Upload newsletter PDF / file</label><input type="file" id="newsFile" accept=".pdf,image/*"><input type="url" id="newsUrl" placeholder="Or paste newsletter link"><label class="field-label">Cover image (optional)</label><input type="file" id="newsImage" accept="image/*"><button onclick="saveNewsletterV3()">SAVE NEWSLETTER</button><h3>Add Upcoming Event</h3><input id="eventTitle" placeholder="Event title"><input type="date" id="eventDate"><label class="field-label">Start time</label><input type="time" id="eventStartTime"><label class="field-label">End time</label><input type="time" id="eventEndTime"><input id="eventLocation" placeholder="Location"><input id="eventAge" placeholder="Age restriction e.g. 18+ / All ages"><input id="eventPrice" placeholder="Ticket price e.g. £10 / Free"><input type="url" id="eventTicketUrl" placeholder="Ticket or Facebook link"><label class="field-label">Event image (optional)</label><input type="file" id="eventImage" accept="image/*"><textarea id="eventDetails" class="large-notes" placeholder="Event details (optional)"></textarea><button onclick="saveEventV3()">SAVE EVENT</button></div><div id="adminNewsEvents"></div></div></div><div class="admin-group"><h2>PARENT MAILING LIST</h2><button class="secondary" onclick="toggleSection('mailingSection');renderMailingListV3()">OPEN MAILING LIST</button><div id="mailingSection" class="admin-section" style="display:none"><div id="adminMailingList"></div></div></div><div class="admin-group"><h2>ACCOUNTS & SECURITY</h2><button class="secondary" onclick="location.href='admin-settings.html'">OPEN ACCOUNTS & SECURITY</button></div><div class="logout-section"><button onclick="logoutAdmin()" class="logout-btn">LOG OUT</button></div></div></main><footer>Raving 4 A Reason CIC | C.I.C REG 16251433</footer><script src="data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
