<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Members</title></head><body data-admin-page="members"><div class="logo-wrap"><img src="r4ar.png" class="logo"></div><main class="container admin-container"><button class="back-chip" onclick="location.href='admin.html'">← Back</button><h1>Members</h1><button onclick="openMemberForm()">ADD MEMBER</button><div id="addMemberSection" class="form-panel" style="display:none"><input id="memberName" placeholder="Child / Member's Name *"><input id="memberDjMcName" placeholder="DJ / MC Name (optional)"><input id="memberParentGuardian" placeholder="Parent / Guardian Name (optional)"><input type="email" id="memberEmail" placeholder="Email (optional)"><input type="tel" id="memberPhone" placeholder="Phone Number (optional)"><label class="field-label">Date of Birth (optional)</label><input type="date" id="memberDob"><label class="field-label">Date Joined (optional)</label><input type="date" id="memberDateJoined"><p class="field-label">Preferred contact (optional)</p><div class="contact-checks"><label><input type="checkbox" name="memberContactPref" value="Email"> Email</label><label><input type="checkbox" name="memberContactPref" value="SMS"> SMS</label><label><input type="checkbox" name="memberContactPref" value="Phone"> Phone</label><label><input type="checkbox" name="memberContactPref" value="None" onchange="handleNoneContact(this)"> None</label></div><label class="check-row"><input type="checkbox" id="memberMailingConsent"> Parent / guardian agrees to receive R4AR news & event emails</label><select id="memberType"><option value="">Select Type *</option><option>Lessons Paid</option><option>Lessons Funded</option><option>Membership</option><option>Part Funded</option><option>Other</option></select><textarea id="memberAdminNotes" class="large-notes" rows="6" placeholder="Admin notes (optional)"></textarea><button id="saveMemberBtn" onclick="saveMemberAdmin()">SAVE MEMBER</button><button class="secondary" onclick="cancelMemberEdit()">CANCEL</button></div><div class="member-tools"><input type="search" id="memberSearch" placeholder="Search member, parent, email or DJ / MC name" oninput="filterMembers()"><select id="memberTypeFilter" onchange="filterMembers()"><option value="">All Types</option><option>Lessons Paid</option><option>Lessons Funded</option><option>Membership</option><option>Part Funded</option><option>Other</option></select></div><div id="adminMembers"></div><button class="secondary section-bottom-action" onclick="printAdminList('members')">DOWNLOAD / PRINT MEMBERS</button></main><script src="data.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
